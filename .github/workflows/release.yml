name: Release

# Called by CI only after the build and real Mudlet checks pass for this commit.
# Publish here: tags pushed using GITHUB_TOKEN do not trigger another workflow.
on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: duris-client-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    if: >-
      github.repository == 'LuminariMUD/duris-client' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install luac (Lua 5.1, matching Mudlet)
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - name: Publish VERSION if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --output "$RUNNER_TEMP/release" --publish
