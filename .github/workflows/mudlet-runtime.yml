name: Mudlet runtime

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  offline:
    name: Offline behavior (visual review remains manual)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set artifact directory
        run: echo "MUDLET_ARTIFACTS=$RUNNER_TEMP/mudlet-runs" >> "$GITHUB_ENV"
      - name: Install pinned Mudlet and desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mudlet.deb" \
            https://github.com/Mudlet/Mudlet/releases/download/Mudlet-5.0.1/Mudlet-5.0.1-ubuntu-26.04-amd64.deb
          echo '6ea43609e9d043e9272b67ddb356ba8b33894682453ddfb4d61c0406e5dc8b25  '"$RUNNER_TEMP/mudlet.deb" | sha256sum --check
          sudo apt-get install --no-install-recommends -y \
            python3 lua5.1 xvfb xauth openbox xdotool imagemagick \
            fonts-dejavu-core fontconfig ca-certificates "$RUNNER_TEMP/mudlet.deb"
      - name: Controller checks
        run: |
          python3 scripts/mudlet_test.py doctor
          python3 -m unittest discover -s tests/mudlet -p 'test_*.py'
      - name: Real Mudlet scenarios and deliberate failures
        run: python3 scripts/mudlet_suite.py --root "$MUDLET_ARTIFACTS"
      - name: Summarize scenario results
        if: always()
        run: |
          python3 - "$MUDLET_ARTIFACTS/suite-results.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if not path.exists():
              print("### Mudlet scenarios: no results written")
              raise SystemExit
          cases = json.loads(path.read_text()).get("cases", [])
          failed = [c for c in cases if not c.get("passed")]
          print(f"### Mudlet scenarios: {len(cases) - len(failed)}/{len(cases)} passed")
          for case in failed:
              print(f"- FAILED: `{case['case']}` (exit {case.get('exit_code')})")
              result = Path(case["run"] or "") / "results.json"
              error = json.loads(result.read_text()).get("error") if case.get("run") and result.is_file() else None
              detail = (error or case.get("stderr") or "no error recorded").strip()
              print("\n```\n" + detail[:3000] + "\n```")
          print("\nVisual review of screenshots is still manual.")
          PY
      - name: Checks left the checkout unchanged
        run: |
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Stop any remaining owned desktops
        if: always()
        shell: bash
        run: |
          if [ -d "$MUDLET_ARTIFACTS" ]; then
            find "$MUDLET_ARTIFACTS" -name owner.json -print0 | while IFS= read -r -d '' owner; do
              python3 scripts/mudlet_test.py stop --run-dir "$(dirname "$owner")"
            done
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mudlet-runtime-${{ github.sha }}
          path: ${{ env.MUDLET_ARTIFACTS }}
          retention-days: 14
